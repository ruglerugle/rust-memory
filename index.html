<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUST MEMORY QUEST ― 壊れる前に止めろ ―</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell" id="app-shell">
  <header class="game-header">
    <div class="brand"><div class="brand-title">RUST MEMORY QUEST</div><div class="brand-sub">― 壊れる前に止めろ ―</div></div>
    <div class="head-progress-wrap"><div class="head-progress-label" id="progress-label">クリア 0 / 5</div><div class="head-progress"><div class="head-progress-fill" id="progress-fill"></div></div></div>
    <div class="header-actions"><a class="head-btn home-badge" href="https://ruglerugle.github.io/" title="クエスト集トップへ" aria-label="クエスト集トップへ">🧭</a><button id="head-nav-toggle" class="head-btn">☰ ナビ</button></div>
  </header>
  <div class="game-layout">
    <div class="side-backdrop" id="side-backdrop"></div>
    <aside class="side-panel" id="stage-sidebar"><div class="side-head"><span>ステージ一覧</span></div><nav id="stage-nav" class="step-list"></nav></aside>
    <main class="main-area">
      <div id="dialogue-panel" class="dialogue-panel"></div>
      <div class="mission-banner"><div><div id="mission-title" class="mission-title"></div><div id="mission-text" class="mission-text"></div></div><div id="mission-status" class="mission-status"></div></div>
      <section class="stage-area">
        <div class="world-wrap">
          <div class="mode-tabs"><button class="mode-tab active" id="tab-c">Cの国</button><button class="mode-tab" id="tab-rust">Rust王国</button></div>
          <div class="scene">
            <div id="hero" class="hero">🧙‍♂️</div>
            <div class="scene-status"><div id="scene-main"></div><div id="scene-tags" class="scene-tags"></div></div>
          </div>
        </div>
        <aside class="actions-panel"><h3>行動を選ぶ</h3><div id="stage-actions" class="actions"></div></aside>
      </section>
      <footer class="control-bar"><button id="btn-reset">↺ ステージリセット</button><button id="btn-rewind" disabled>⏪ Rustでやり直す</button><button id="btn-next" class="primary" disabled>次のステージ</button></footer>
      <div class="bottom-grid">
        <section class="log-panel"><h3>実行ログ</h3><ul id="log-list" class="log-list"></ul></section>
        <section class="lesson-panel"><h3>この章で分かること</h3><p id="lesson-text"></p><div id="term-box" class="term-box"></div></section>
      </div>
    </main>
  </div>
</div>
<script>
const stages=[
{
 title:'第1章　消えた勇者',nav:'解放後使用',mission:'アキが勇者を消した後、ボブが消えたはずの勇者への参照を使うと何が起きるか確認してください。',
 dialogue:[['うさ美','C言語では、メモリを好きなタイミングで消せるんですよね。'],['ねこ先生','はい。ただし、ほかの処理がまだ使っているかどうかも、自分で管理する必要があります。']],
 cActions:[['destroy','アキが勇者を消す','ボブがまだ利用している状態で召喚解除します'],['use','ボブが勇者を動かす','消えたはずの勇者への参照を使います']],
 rActions:[['tryDestroy','アキが勇者を消そうとする','ボブが利用中なので、まず止められるか確認します'],['finish','ボブが利用を終える','勇者への借用を終了します'],['safeDestroy','アキが勇者を消す','誰も使っていない状態で片付けます']],
 lesson:'所有権は「誰が使えるか」だけでなく、「誰が最後に片付けるか」を決めます。借用中のデータを先に破棄できないため、消えたメモリを使う事故を防げます。',terms:[['use-after-free','解放済みメモリを再び使う事故'],['所有権','データを最後まで管理し、後片付けをする責任を持つこと'],['借用','所有権を渡さず一時的に使わせる仕組み']]
},
{
 title:'第2章　二度目の召喚解除',nav:'二重解放',mission:'アキとボブが同じ勇者を管理していると、片付け時に何が起きるか確認してください。',
 dialogue:[['うさ美','2人とも管理者になれば、どちらかが片付けられて便利では？'],['ねこ先生','2人とも片付けると、同じメモリを2回解放してしまいます。']],
 cActions:[['destroyA','アキが勇者を消す','1回目の召喚解除です'],['destroyB','ボブも勇者を消す','同じ勇者をもう一度消します']],
 rActions:[['move','管理担当をボブへ渡す','所有権を移動します'],['oldDestroy','アキが消そうとする','以前の所有者から操作します'],['newDestroy','ボブが勇者を消す','現在の所有者が1回だけ破棄します']],
 lesson:'通常の値の所有者を1人にするのは、同じデータを複数人が破棄する二重解放を防ぐためです。所有権をmoveすると、以前の所有者はその値を使えなくなります。',terms:[['double free','同じメモリを2回解放する事故'],['move','所有権を別の変数や処理へ移すこと']]
},
{
 title:'第3章　着替え途中の防御力',nav:'変更途中の参照',mission:'防御力100から150へ着替える途中で、ボブが値を読むと何が起きるか確認してください。',
 dialogue:[['うさ美','読むだけなら、いつ読んでも安全では？'],['ねこ先生','変更の途中には、防御力0のような一時的な状態が存在します。']],
 cActions:[['remove','古い鎧を脱ぐ','防御力が一時的に0になります'],['read','ボブが防御力を見る','変更途中の値を読みます'],['equip','新しい鎧を着る','防御力を150にします']],
 rActions:[['change','勇者を更衣室に入れる','排他的な変更を開始します'],['peek','ボブが防御力を見ようとする','変更中に読み取ろうとします'],['complete','着替えを完了する','完成した防御力150を公開します']],
 lesson:'可変借用中にほかの参照を許さないのは、変更途中の不完全な状態を外部から読ませないためです。「着替え中は見られない」という制約が、データの整合性を守ります。',terms:[['共有借用','読むだけなら複数存在できる参照'],['可変借用','変更できる一時的かつ排他的な参照']]
},
{
 title:'第4章　消えた100ゴールド',nav:'同時変更',mission:'勇者パーティの資金1000Gから、アキとボブが同時に100Gずつ使い、更新が失われる様子を確認してください。',
 dialogue:[['うさ美','2人が同時に100G使えば、800Gになるだけですよね。'],['ねこ先生','両方が最初の1000Gを読んでから書き戻すと、900Gになる場合があります。']],
 cActions:[['readA','アキが1000Gを読む','100G使う計算を始めます'],['readB','ボブも1000Gを読む','同じ古い値を読みます'],['writeA','アキが900Gを書き込む','計算結果を反映します'],['writeB','ボブも900Gを書き込む','アキの更新を上書きします']],
 rActions:[['lockA','アキが財布を確保する','変更者を1人にします'],['waitB','ボブは順番待ちする','同時変更せず待機します'],['spendA','アキが100G使う','1000Gから900Gにします'],['spendB','ボブが100G使う','900Gから800Gにします']],
 lesson:'変更者を同時に1人へ制限するのは、複数処理が同じ古い値を読み、片方の更新を消してしまうデータ競合を防ぐためです。スレッド間ではMutexなどで順番を管理します。',terms:[['データ競合','複数の処理が同時に同じデータを読み書きし、結果が想定と変わってしまうこと'],['Mutex','共有データを1人ずつ変更させる仕組み']]
},
{
 title:'第5章　残された案内矢印',nav:'ライフタイム',mission:'勇者を指す案内矢印を残したまま、勇者を先に消すと何が起きるか確認してください。',
 dialogue:[['うさ美','参照は、データの場所を覚えているだけですよね。'],['ねこ先生','だからこそ、本体が消えた後も場所だけ残ると危険です。']],
 cActions:[['arrow','ボブが案内矢印を持つ','勇者の場所を参照します'],['destroy','勇者を消す','参照だけを残します'],['follow','案内矢印をたどる','存在しない勇者へアクセスします']],
 rActions:[['borrow','ボブが勇者を見る','本体がある間だけ参照します'],['tryDestroy','勇者を先に消そうとする','参照中の破棄を試みます'],['end','ボブが見るのを終える','参照の寿命を終了します'],['destroySafe','その後、勇者を消す','参照がない状態で破棄します']],
 lesson:'ライフタイムは、参照が参照先より長生きしないことを保証します。これにより、存在しないデータや同じ場所に後から置かれた別データを誤って操作する事故を防ぎます。',terms:[['ダングリングポインタ','参照先が消えた後も残っているポインタ'],['ライフタイム','参照が安全に使える期間']]
}
];
let s=0,mode='c',cleared=new Set(),state={},logs=[],crashed=false;
const $=id=>document.getElementById(id);
function fresh(){state={hero:true,bobUsing:s===0,owner:'アキ',def:100,changing:false,gold:1000,aRead:null,bRead:null,locked:null,queued:false,arrow:false,step:0};logs=[];crashed=false;mode='c';render()}
function add(text,type=''){logs.push({text,type});renderLog()}
function renderNav(){const nav=$('stage-nav');nav.innerHTML='';stages.forEach((x,i)=>{const b=document.createElement('button');b.className='stage-link'+(i===s?' active':'')+(cleared.has(i)?' cleared':'');b.innerHTML=`${i+1}. ${x.nav}<small>${x.title}</small>`;b.onclick=()=>{s=i;fresh();closeNav()};nav.appendChild(b)})}
const CHAR_IMAGE_PATHS={
  cat:'images/cat.png',
  rabbit:'images/rabbit.png'
};
function characterCard(name){
 const isCat=name==='ねこ先生';
 const key=isCat?'cat':'rabbit';
 const label=isCat?'ねこ先生':'うさ美';
 const fallback=isCat?'🐱':'🐰';
 return `<div class="dialog-character"><img src="${CHAR_IMAGE_PATHS[key]}" alt="${label}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="emoji-fallback" aria-hidden="true">${fallback}</div><div class="dialog-name ${key}">${label}</div></div>`;
}
function renderDialogue(){const box=$('dialogue-panel');box.innerHTML='';stages[s].dialogue.forEach(([name,text])=>{const d=document.createElement('div');d.className='speech '+(name==='うさ美'?'rabbit':'cat');d.innerHTML=`${characterCard(name)}<div class="bubble"><p>${text}</p></div>`;box.appendChild(d)})}
function scene(){let emoji='🧙‍♂️',main='勇者アルドは存在しています',tags=[];
 if(s===2){emoji=state.changing?'🚪':'🛡️';main=`防御力：${state.def}`;tags.push(state.changing?'装備変更中':'完成した状態')}
 else if(s===3){emoji='💰';main=`所持金：${state.gold}G`;tags.push(state.locked?`${state.locked}が変更中`:'変更者なし');if(state.queued)tags.push('ボブは順番待ち')}
 else{emoji=state.hero?'🧙‍♂️':'💨';main=state.hero?'勇者アルドは存在しています':'勇者アルドは消滅しました';if(s===0&&state.bobUsing)tags.push('ボブが利用中');if(s===1)tags.push(`管理担当：${state.owner}`);if(s===4&&state.arrow)tags.push('案内矢印が残っている')}
 $('hero').textContent=emoji;$('hero').classList.toggle('gone',!state.hero&&s!==2&&s!==3);$('scene-main').textContent=main;$('scene-tags').innerHTML=tags.map(t=>`<span class="tag ${(!state.hero&&state.arrow)?'danger':''}">${t}</span>`).join('')}
function renderActions(){const list=mode==='c'?stages[s].cActions:stages[s].rActions;const box=$('stage-actions');box.innerHTML='';list.forEach(([id,title,sub])=>{const b=document.createElement('button');b.className='action-btn';b.innerHTML=`<strong>${title}</strong><span>${sub}</span>`;b.onclick=()=>act(id);box.appendChild(b)})}
function renderLog(){$('log-list').innerHTML=logs.length?logs.map(x=>`<li class="${x.type}">${x.text}</li>`).join(''):'<li>まだ操作されていません。</li>'}
function renderTerms(){$('term-box').innerHTML=stages[s].terms.map(([a,b])=>`<div class="term-row"><b>${a}</b><span>${b}</span></div>`).join('')}
function render(){renderNav();renderDialogue();$('mission-title').textContent=stages[s].title;$('mission-text').textContent=stages[s].mission;$('mission-status').textContent=mode==='c'?(crashed?'事故発生':'Cモード'):(cleared.has(s)?'安全に完了':'Rustモード');$('tab-c').classList.toggle('active',mode==='c');$('tab-rust').classList.toggle('active',mode==='rust');$('lesson-text').textContent=stages[s].lesson;renderTerms();scene();renderActions();renderLog();$('btn-rewind').disabled=!crashed||mode==='rust';$('btn-next').disabled=!cleared.has(s);$('progress-label').textContent=`クリア ${cleared.size} / ${stages.length}`;$('progress-fill').style.width=`${cleared.size/stages.length*100}%`}
function crash(text){crashed=true;add(text,'danger');add('事故が起きました。時間を巻き戻し、Rustの制約で同じ事故を防いでください。','danger');render()}
function block(text){add(`コンパイラが停止：「${text}」`,'blocked')}
function clearStage(text){cleared.add(s);add(text);add('実行前の制約によって、Cモードで起きた事故を防げました。');render()}
function act(id){
 if(s===0){if(mode==='c'){if(id==='destroy'){state.hero=false;add('アキが勇者を消しました。その場では何も起きません。')}if(id==='use'){state.hero?add('ボブが勇者を動かしました。'):crash('ボブが消滅済みの勇者を操作し、世界が壊れました。')}}else{if(id==='tryDestroy')block(state.bobUsing?'ボブがまだ利用中です。勇者は消せません。':'利用者はいません。');if(id==='finish'){state.bobUsing=false;add('ボブが利用を終えました。')}if(id==='safeDestroy'){state.bobUsing?block('先にボブの利用を終えてください。'):(state.hero=false,clearStage('誰も使っていないことを確認してから、安全に勇者を消しました。'))}}}
 if(s===1){if(mode==='c'){if(id==='destroyA'){state.hero=false;add('アキが勇者を消しました。')}if(id==='destroyB'){state.hero?add('ボブが勇者を消しました。'):crash('ボブが同じ勇者をもう一度消し、メモリ管理領域が壊れました。')}}else{if(id==='move'){state.owner='ボブ';add('管理担当をアキからボブへ移しました。')}if(id==='oldDestroy')block(state.owner==='ボブ'?'アキはもう所有者ではありません。':'先に所有権を移してください。');if(id==='newDestroy'){state.owner==='ボブ'?(state.hero=false,clearStage('現在の所有者であるボブが、1回だけ安全に破棄しました。')):block('ボブは所有者ではありません。')}}}
 if(s===2){if(mode==='c'){if(id==='remove'){state.def=0;state.changing=true;add('古い鎧を脱ぎ、防御力が一時的に0になりました。')}if(id==='read'){state.def===0?crash('ボブが変更途中の防御力0を読み、誤った撤退判断をしました。'):add(`ボブは防御力${state.def}を読みました。`)}if(id==='equip'){state.def=150;state.changing=false;add('新しい鎧を着て、防御力が150になりました。')}}else{if(id==='change'){state.changing=true;add('勇者を更衣室に入れ、排他的な変更を始めました。')}if(id==='peek')block(state.changing?'変更途中の値は読めません。':'まだ変更中ではありません。');if(id==='complete'){state.changing?(state.def=150,state.changing=false,clearStage('変更が終わってから、防御力150を公開しました。')):block('先に着替えを始めてください。')}}}
 if(s===3){if(mode==='c'){if(id==='readA'){state.aRead=state.gold;add(`アキが${state.gold}Gを読みました。`)}if(id==='readB'){state.bRead=state.gold;add(`ボブも${state.gold}Gを読みました。`)}if(id==='writeA'){state.aRead==null?add('先にアキが所持金を読んでください。'):(state.gold=state.aRead-100,add('アキが900Gを書き込みました。'))}if(id==='writeB'){state.bRead==null?add('先にボブが所持金を読んでください。'):(state.gold=state.bRead-100,(state.aRead===1000&&state.bRead===1000)?crash('200G使ったのに900Gです。アキの更新が消えました。'):add('ボブが結果を書き込みました。'))}}else{if(id==='lockA'){state.locked='アキ';add('アキが財布の変更権を確保しました。')}if(id==='waitB'){state.locked==='アキ'?(state.queued=true,add('ボブは順番待ちに入りました。')):block('先にアキが変更権を確保してください。')}if(id==='spendA'){state.locked==='アキ'?(state.gold-=100,state.locked=null,add('アキが100G使い、900Gになりました。')):block('アキは変更権を持っていません。')}if(id==='spendB'){state.queued&&!state.locked?(state.gold-=100,clearStage('ボブが順番に100G使い、正しく800Gになりました。')):block('アキの処理後、ボブが順番待ちしている必要があります。')}}}
 if(s===4){if(mode==='c'){if(id==='arrow'){state.arrow=true;add('ボブが勇者への案内矢印を持ちました。')}if(id==='destroy'){state.hero=false;add('勇者を消しましたが、案内矢印は残っています。')}if(id==='follow'){state.arrow&&!state.hero?crash('ボブが案内をたどりましたが、参照先はもう存在しません。'):add('案内矢印をたどりました。')}}else{if(id==='borrow'){state.arrow=true;add('ボブが勇者を一時的に参照しています。')}if(id==='tryDestroy')block(state.arrow?'参照が残っているため、勇者を消せません。':'参照はありません。');if(id==='end'){state.arrow=false;add('ボブが見るのを終え、参照がなくなりました。')}if(id==='destroySafe'){state.arrow?block('先に参照を終了してください。'):(state.hero=false,clearStage('参照が先に終了したため、安全に勇者を消しました。'))}}}
 render();}
function rewind(){mode='rust';crashed=false;logs=[{text:'時間を巻き戻しました。Rustのコンパイラが危険な操作を事前に確認します。',type:'blocked'}];state={hero:true,bobUsing:s===0,owner:'アキ',def:100,changing:false,gold:1000,aRead:null,bRead:null,locked:null,queued:false,arrow:false,step:0};render()}
$('btn-reset').onclick=fresh;$('btn-rewind').onclick=rewind;$('btn-next').onclick=()=>{if(s<stages.length-1){s++;fresh()}else{alert('全ステージクリアです。Rustの制約は、Cで実行後に発覚するメモリ事故を、実行前に止めるためにあります。')}};$('tab-c').onclick=()=>{if(!cleared.has(s)){fresh()}};$('tab-rust').onclick=()=>{if(crashed)rewind()};
function toggleNav(){ $('stage-sidebar').classList.toggle('open');$('side-backdrop').classList.toggle('open') }function closeNav(){$('stage-sidebar').classList.remove('open');$('side-backdrop').classList.remove('open')}$('head-nav-toggle').onclick=toggleNav;$('side-backdrop').onclick=closeNav;
fresh();
</script>
</body>
</html>
